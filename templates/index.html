<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scopus Publications Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Scopus Publications Search</h2>
                        <form action="/search" method="post">
                            <div class="mb-3">
                                <label for="identifier" class="form-label">Scopus Author ID or ORCID</label>
                                <input type="text" class="form-control" id="identifier" name="identifier" placeholder="e.g. 7004212771 or 0000-0000-0000-0000" required>
                            </div>

                            <div class="mb-3">
                                <label for="api_key" class="form-label">Scopus API Key (Optional)</label>
                                <input type="password" class="form-control" id="api_key" name="api_key" placeholder="Enter API Key for live data (not stored)">
                                <div class="form-text">If left blank, Mock Mode will be used.</div>
                            </div>

                            <hr class="my-4">
                            <h5 class="mb-3">Advanced Filters</h5>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="af_id" class="form-label">Affiliation ID (AF-ID)</label>
                                    <input type="text" class="form-control" id="af_id" name="af_id" value="60014930">
                                </div>
                                <div class="col-md-6">
                                    <label for="subj_area" class="form-label">Subject Area (SUBJAREA)</label>
                                    <input type="text" class="form-control" id="subj_area" name="subj_area" value="MEDI">
                                </div>
                                <div class="col-md-4">
                                    <label for="start_year" class="form-label">Start Year</label>
                                    <input type="number" class="form-control" id="start_year" name="start_year" value="2022">
                                </div>
                                <div class="col-md-4">
                                    <label for="end_year" class="form-label">End Year</label>
                                    <input type="number" class="form-control" id="end_year" name="end_year" value="2027">
                                </div>
                                <div class="col-md-4">
                                    <label for="doctype" class="form-label">Document Type (DOCTYPE)</label>
                                    <input type="text" class="form-control" id="doctype" name="doctype" value="ar">
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary">Search Publications</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
