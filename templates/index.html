<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WoS Publications Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Web of Science Publications</h2>
                        <form action="/search" method="post">
                            <div class="mb-3">
                                <label for="identifier" class="form-label">ResearcherID or ORCID</label>
                                <input type="text" class="form-control" id="identifier" name="identifier" placeholder="e.g. A-1234-5678 or 0000-0000-0000-0000" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Search Publications</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
